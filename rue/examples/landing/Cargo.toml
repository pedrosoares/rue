[package]
name = "rue-landing"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rue-core = { path = "../../core" }
rue-macros = { path = "../../macros" }
wasm-bindgen = "0.2.100"
web-sys = { version = "0.3", features = [
    "Event",
    "MouseEvent",
] }
console_error_panic_hook = "0.1"
